<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muybridge Horse - Galloping Study (1878)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #2a2520;
            color: #e8dcc8;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            max-width: 1200px;
        }

        .title {
            text-align: center;
            margin-bottom: 10px;
        }

        .title h1 {
            font-size: 24px;
            font-weight: normal;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .title p {
            font-size: 12px;
            opacity: 0.7;
            font-style: italic;
        }

        .canvas-wrapper {
            background: #f4ead5;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        /* Film strip sprocket holes */
        .canvas-wrapper::before,
        .canvas-wrapper::after {
            content: '';
            position: absolute;
            top: 50px;
            bottom: 50px;
            width: 15px;
            background: repeating-linear-gradient(
                to bottom,
                transparent 0px,
                transparent 10px,
                #2a2520 10px,
                #2a2520 20px
            );
        }

        .canvas-wrapper::before {
            left: 10px;
        }

        .canvas-wrapper::after {
            right: 10px;
        }

        canvas {
            display: block;
            border-radius: 10px;
            background: #f4ead5;
        }

        .controls {
            background: rgba(244, 234, 213, 0.1);
            padding: 20px 30px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-width: 500px;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 15px;
            justify-content: space-between;
        }

        .control-group label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        button {
            background: #e8dcc8;
            color: #2a2520;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s;
        }

        button:hover {
            background: #d4c7b0;
            transform: translateY(-1px);
        }

        button.active {
            background: #8b7355;
            color: #f4ead5;
        }

        input[type="range"] {
            flex: 1;
            min-width: 150px;
        }

        .button-group {
            display: flex;
            gap: 8px;
        }

        .info {
            font-size: 11px;
            opacity: 0.6;
            text-align: center;
            max-width: 600px;
            line-height: 1.6;
        }

        .fps-display {
            font-size: 12px;
            min-width: 60px;
            text-align: right;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .controls {
                min-width: auto;
                width: 100%;
            }

            .control-group {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">
            <h1>THE HORSE IN MOTION</h1>
            <p>After Eadweard Muybridge, 1878</p>
        </div>

        <div class="canvas-wrapper">
            <canvas id="canvas" width="1080" height="1080"></canvas>
        </div>

        <div class="controls">
            <div class="control-group">
                <label>View Mode:</label>
                <div class="button-group">
                    <button id="modeAnimated" class="active">Animated</button>
                    <button id="modeGrid">Grid</button>
                    <button id="modeHybrid">Hybrid</button>
                </div>
            </div>

            <div class="control-group">
                <label>Playback:</label>
                <div class="button-group">
                    <button id="playPause">Pause</button>
                    <button id="prevFrame">← Prev</button>
                    <button id="nextFrame">Next →</button>
                </div>
            </div>

            <div class="control-group">
                <label>Speed (FPS):</label>
                <input type="range" id="fpsSlider" min="2" max="24" value="12" step="1">
                <span class="fps-display" id="fpsDisplay">12 FPS</span>
            </div>

            <div class="control-group">
                <button id="fullscreen">Enter Fullscreen</button>
            </div>
        </div>

        <div class="info">
            Keyboard: [SPACE] Play/Pause • [1] Animated • [2] Grid • [3] Hybrid • [←/→] Navigate Frames • [F] Fullscreen
        </div>
    </div>

    <script>
        // ============================================
        // MUYBRIDGE HORSE ANIMATION
        // Decision Log embedded in code comments
        // ============================================

        // DECISION: Canvas resolution set to 1080x1080
        // RATIONALE: Largest square that fits within 1920x1080 target resolution.
        //            Square format honors the film frame aesthetic and works well
        //            for exhibition display centered on standard screens.

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // DECISION: 16 frames for complete gallop cycle
        // RATIONALE: Muybridge's original studies used 12-16 frames. 16 provides
        //            smooth motion while maintaining the sequential study aesthetic.
        //            Each frame represents approximately 1/16 of a second at gallop speed.

        // Animation state
        let currentFrame = 0;
        let isPlaying = true;
        let fps = 12;
        let mode = 'animated'; // 'animated', 'grid', or 'hybrid'
        let lastFrameTime = 0;

        // DECISION: Horse silhouettes coded as simplified vector paths
        // RATIONALE: Each frame hand-coded as path coordinates representing
        //            key positions in the gallop cycle. Silhouette style matches
        //            Muybridge's high-contrast photography aesthetic.
        //
        // Gallop cycle phases:
        // Frames 0-3: Gathered/compression phase
        // Frames 4-7: Extension phase (including "floating" moment)
        // Frames 8-11: Mid-stride phase
        // Frames 12-15: Recovery/gathering phase

        function createHorseFrame(frameIndex) {
            // Returns a function that draws the horse for this frame
            // Each horse is designed to fit in a normalized coordinate space
            // that will be scaled to fit the canvas

            return function(ctx, scale, offsetX, offsetY) {
                ctx.save();
                ctx.translate(offsetX, offsetY);
                ctx.scale(scale, scale);
                ctx.fillStyle = '#000000';
                ctx.beginPath();

                // UPDATED: Detailed anatomically accurate horse ~300 units wide, ~180 units tall
                // Based on Muybridge studies and proper horse anatomy research
                switch(frameIndex) {
                    case 0: // Gathered position - all legs under body
                        drawHorse0(ctx);
                        break;
                    case 1: // Starting to extend front
                        drawHorse1(ctx);
                        break;
                    case 2: // Front legs extending forward
                        drawHorse2(ctx);
                        break;
                    case 3: // Front extended, back gathering
                        drawHorse3(ctx);
                        break;
                    case 4: // Front touching down, back extending
                        drawHorse4(ctx);
                        break;
                    case 5: // Weight on front, back extending
                        drawHorse5(ctx);
                        break;
                    case 6: // Mid extension
                        drawHorse6(ctx);
                        break;
                    case 7: // All legs extended - "floating" phase
                        drawHorse7(ctx);
                        break;
                    case 8: // Back legs forward, front lifting
                        drawHorse8(ctx);
                        break;
                    case 9: // Back legs under, front legs gathering
                        drawHorse9(ctx);
                        break;
                    case 10: // Back supporting, front gathering
                        drawHorse10(ctx);
                        break;
                    case 11: // Weight on back, front extending
                        drawHorse11(ctx);
                        break;
                    case 12: // Back pushing off, front reaching
                        drawHorse12(ctx);
                        break;
                    case 13: // Extension phase beginning
                        drawHorse13(ctx);
                        break;
                    case 14: // All legs gathering
                        drawHorse14(ctx);
                        break;
                    case 15: // Return to gathered position
                        drawHorse15(ctx);
                        break;
                }

                ctx.fill();
                ctx.restore();
            };
        }

        // COMPLETELY REDRAWN: Anatomically accurate horse silhouettes
        // Based on Muybridge's original studies and proper equine anatomy
        // Coordinate system: ~300 units wide, ~200 units tall

        // Reusable function to draw detailed horse body with head, neck, torso, tail
        function drawHorseBody(ctx, bodyTilt = 0) {
            // Body outline with proper proportions
            // Start from back/croup
            ctx.moveTo(50, 95); // Dock of tail
            ctx.bezierCurveTo(48, 92, 48, 88, 50, 85); // Croup
            ctx.bezierCurveTo(55, 78, 65, 75, 75, 74); // Loin
            ctx.bezierCurveTo(95, 72, 115, 71, 135, 70); // Back
            ctx.bezierCurveTo(145, 70, 155, 69, 165, 68); // Withers (highest point)
            ctx.bezierCurveTo(172, 68, 178, 69, 183, 72); // Shoulder
            ctx.bezierCurveTo(188, 75, 192, 79, 195, 84); // Point of shoulder
            ctx.bezierCurveTo(198, 89, 200, 95, 201, 100); // Chest

            // Underline (belly)
            ctx.bezierCurveTo(200, 108, 195, 113, 188, 116); // Girth
            ctx.bezierCurveTo(175, 120, 160, 122, 145, 123); // Belly
            ctx.bezierCurveTo(125, 123, 105, 122, 85, 120); // Flank
            ctx.bezierCurveTo(70, 118, 58, 114, 50, 108); // Hindquarters underline
            ctx.bezierCurveTo(48, 103, 48, 99, 50, 95); // Back to dock

            // Neck - arched and elegant (separate path)
            ctx.moveTo(165, 68); // Base of neck at withers
            ctx.bezierCurveTo(172, 62, 180, 56, 188, 50); // Crest (top of neck)
            ctx.bezierCurveTo(195, 45, 202, 41, 209, 38); // Poll
            ctx.bezierCurveTo(215, 36, 221, 35, 227, 36); // Forehead/face
            ctx.bezierCurveTo(233, 37, 238, 40, 242, 44); // Nose bridge
            ctx.bezierCurveTo(245, 47, 247, 51, 248, 55); // Muzzle
            ctx.lineTo(250, 58); // Nostril
            ctx.bezierCurveTo(248, 60, 245, 61, 242, 61); // Lower muzzle
            ctx.bezierCurveTo(238, 61, 234, 60, 230, 58); // Mouth
            ctx.bezierCurveTo(225, 56, 220, 55, 215, 55); // Jaw
            ctx.bezierCurveTo(210, 56, 205, 58, 200, 62); // Throatlatch
            ctx.bezierCurveTo(195, 66, 190, 71, 186, 77); // Under neck
            ctx.bezierCurveTo(183, 82, 181, 87, 180, 92); // Windpipe
            ctx.bezierCurveTo(183, 90, 187, 88, 191, 87); // Back to chest
            ctx.bezierCurveTo(193, 84, 195, 80, 195, 76);
            ctx.bezierCurveTo(190, 74, 182, 71, 175, 70);
            ctx.bezierCurveTo(172, 69, 168, 68, 165, 68); // Back to withers

            // Ear
            ctx.moveTo(209, 38);
            ctx.lineTo(208, 32); // Ear tip
            ctx.lineTo(211, 36);

            // Tail - flowing behind
            ctx.moveTo(50, 90); // Tail base
            ctx.quadraticCurveTo(38, 95, 30, 105); // Tail curves back
            ctx.quadraticCurveTo(25, 112, 22, 120); // Tail flowing
            ctx.quadraticCurveTo(20, 125, 19, 130);
            ctx.quadraticCurveTo(20, 128, 22, 125);
            ctx.quadraticCurveTo(25, 118, 28, 112);
            ctx.quadraticCurveTo(33, 104, 40, 98);
            ctx.quadraticCurveTo(45, 94, 49, 92);
        }

        // Master function to draw complete horse with configurable leg positions
        function drawDetailedHorse(ctx, legConfig) {
            // legConfig = {fl, fr, hl, hr} where each is {x, y, angle, extend}
            ctx.beginPath();

            // Draw body first
            drawHorseBody(ctx);

            // Draw all four legs
            // Front left
            drawSimpleLeg(ctx, legConfig.fl.x, legConfig.fl.y, legConfig.fl.angle, legConfig.fl.extend);
            // Front right
            drawSimpleLeg(ctx, legConfig.fr.x, legConfig.fr.y, legConfig.fr.angle, legConfig.fr.extend);
            // Hind left
            drawSimpleLeg(ctx, legConfig.hl.x, legConfig.hl.y, legConfig.hl.angle, legConfig.hl.extend);
            // Hind right
            drawSimpleLeg(ctx, legConfig.hr.x, legConfig.hr.y, legConfig.hr.angle, legConfig.hr.extend);
        }

        // Simplified leg drawing - clean lines with joints
        function drawSimpleLeg(ctx, x, y, angle, extendDist) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);

            // Leg segments
            let upper = 35; // Femur/humerus
            let lower = 38; // Tibia/radius-ulna
            let cannon = 45; // Metacarpal/metatarsal

            // Calculate joint positions based on extension
            let kneeX = extendDist * 0.4;
            let kneeY = upper;
            let ankleX = extendDist * 0.6;
            let ankleY = upper + lower;
            let hoofX = extendDist;
            let hoofY = upper + lower + cannon;

            // Draw leg outline
            ctx.moveTo(-3, 0); // Top of leg (attachment point)
            ctx.lineTo(kneeX - 2, kneeY); // To knee/elbow
            ctx.lineTo(ankleX - 1.5, ankleY); // To ankle/fetlock
            ctx.lineTo(hoofX - 1, hoofY); // To hoof top
            ctx.lineTo(hoofX + 1, hoofY + 8); // Hoof bottom
            ctx.lineTo(hoofX + 3, hoofY + 8); // Hoof back bottom
            ctx.lineTo(hoofX + 3, hoofY); // Hoof back top
            ctx.lineTo(ankleX + 1.5, ankleY); // Back up
            ctx.lineTo(kneeX + 2, kneeY);
            ctx.lineTo(3, 0);
            ctx.closePath();

            ctx.restore();
        }


function drawHorse0(ctx) {
    // Frame 0: Right hind leg pushing off
    drawDetailedHorse(ctx, {
        fl: {x: 185, y: 100, angle: -0.3, extend: 15}, // Front left lifting
        fr: {x: 195, y: 100, angle: -0.1, extend: 8}, // Front right tucked
        hl: {x: 65, y: 95, angle: 0.4, extend: 35}, // Hind left extended back (pushing)
        hr: {x: 75, y: 95, angle: 0.2, extend: 25} // Hind right mid-push
    });
}

function drawHorse1(ctx) {
    // Frame 1: Hind legs extending, front gathering
    drawDetailedHorse(ctx, {
        fl: {x: 185, y: 100, angle: -0.4, extend: 20}, // Front left forward
        fr: {x: 195, y: 100, angle: -0.2, extend: 12}, // Front right lifting
        hl: {x: 65, y: 95, angle: 0.5, extend: 40}, // Hind left fully extended
        hr: {x: 75, y: 95, angle: 0.3, extend: 30} // Hind right extending
    });
}

function drawHorse2(ctx) {
    // Frame 2: Front legs reaching forward, hind leaving ground
    drawDetailedHorse(ctx, {
        fl: {x: 185, y: 100, angle: -0.5, extend: 30}, // Front left extending forward
        fr: {x: 195, y: 100, angle: -0.4, extend: 25}, // Front right reaching
        hl: {x: 65, y: 95, angle: 0.3, extend: 20}, // Hind left lifting
        hr: {x: 75, y: 95, angle: 0.2, extend: 15} // Hind right tucking
    });
}

function drawHorse3(ctx) {
    // Frame 3: Front legs extended forward, hind gathering
    drawDetailedHorse(ctx, {
        fl: {x: 185, y: 100, angle: -0.6, extend: 38}, // Front left fully forward
        fr: {x: 195, y: 100, angle: -0.5, extend: 35}, // Front right extended
        hl: {x: 65, y: 95, angle: 0, extend: 5}, // Hind left gathered
        hr: {x: 75, y: 95, angle: 0.1, extend: 8} // Hind right gathering
    });
}

function drawHorse4(ctx) {
    // Frame 4: SUSPENSION - all legs gathered (Muybridge's discovery!)
    drawDetailedHorse(ctx, {
        fl: {x: 185, y: 100, angle: -0.4, extend: 18}, // All legs tucked
        fr: {x: 195, y: 100, angle: -0.3, extend: 15}, // under body
        hl: {x: 65, y: 95, angle: 0, extend: 10}, // Not extended
        hr: {x: 75, y: 95, angle: 0.1, extend: 12} // but gathered!
    });
}

function drawHorse5(ctx) {
    // Frame 5: Front legs beginning to extend down
    drawDetailedHorse(ctx, {
        fl: {x: 185, y: 100, angle: -0.5, extend: 30}, // Front left extending
        fr: {x: 195, y: 100, angle: -0.4, extend: 28}, // Front right reaching
        hl: {x: 65, y: 95, angle: 0.1, extend: 10}, // Hind still gathered
        hr: {x: 75, y: 95, angle: 0.2, extend: 12} // Hind gathering
    });
}

function drawHorse6(ctx) {
    // Frame 6: Front left touching down
    drawDetailedHorse(ctx, {
        fl: {x: 185, y: 100, angle: -0.6, extend: 40}, // Front left on ground
        fr: {x: 195, y: 100, angle: -0.5, extend: 35}, // Front right extending
        hl: {x: 65, y: 95, angle: 0.2, extend: 15}, // Hind left coming forward
        hr: {x: 75, y: 95, angle: 0.3, extend: 18} // Hind right forward
    });
}

function drawHorse7(ctx) {
    // Frame 7: Weight on front legs, hind legs swinging forward
    drawDetailedHorse(ctx, {
        fl: {x: 185, y: 100, angle: -0.7, extend: 45}, // Front left supporting
        fr: {x: 195, y: 100, angle: -0.6, extend: 42}, // Front right supporting
        hl: {x: 65, y: 95, angle: 0.3, extend: 22}, // Hind left swinging under
        hr: {x: 75, y: 95, angle: 0.4, extend: 25} // Hind right swinging
    });
}

function drawHorse8(ctx) {
    // Frame 8: Hind legs coming under body
    drawDetailedHorse(ctx, {
        fl: {x: 185, y: 100, angle: -0.6, extend: 40}, // Front left weight-bearing
        fr: {x: 195, y: 100, angle: -0.5, extend: 38}, // Front right bearing
        hl: {x: 65, y: 95, angle: 0.4, extend: 28}, // Hind left under body
        hr: {x: 75, y: 95, angle: 0.5, extend: 30} // Hind right under
    });
}

function drawHorse9(ctx) {
    // Frame 9: Hind legs preparing to take weight
    drawDetailedHorse(ctx, {
        fl: {x: 185, y: 100, angle: -0.4, extend: 28}, // Front left lifting
        fr: {x: 195, y: 100, angle: -0.3, extend: 25}, // Front right lifting
        hl: {x: 65, y: 95, angle: 0.5, extend: 35}, // Hind left ready
        hr: {x: 75, y: 95, angle: 0.6, extend: 38} // Hind right ready
    });
}

function drawHorse10(ctx) {
    // Frame 10: Weight transferring to hind
    drawDetailedHorse(ctx, {
        fl: {x: 185, y: 100, angle: -0.2, extend: 15}, // Front left off ground
        fr: {x: 195, y: 100, angle: -0.1, extend: 12}, // Front right lifting
        hl: {x: 65, y: 95, angle: 0.6, extend: 42}, // Hind left bearing weight
        hr: {x: 75, y: 95, angle: 0.7, extend: 45} // Hind right bearing
    });
}

function drawHorse11(ctx) {
    // Frame 11: Hind legs supporting, front legs gathering
    drawDetailedHorse(ctx, {
        fl: {x: 185, y: 100, angle: 0, extend: 8}, // Front left tucked
        fr: {x: 195, y: 100, angle: 0.1, extend: 10}, // Front right gathered
        hl: {x: 65, y: 95, angle: 0.6, extend: 40}, // Hind left supporting
        hr: {x: 75, y: 95, angle: 0.6, extend: 42} // Hind right supporting
    });
}

function drawHorse12(ctx) {
    // Frame 12: Hind pushing off, front reaching
    drawDetailedHorse(ctx, {
        fl: {x: 185, y: 100, angle: -0.3, extend: 18}, // Front left forward
        fr: {x: 195, y: 100, angle: -0.2, extend: 15}, // Front right reaching
        hl: {x: 65, y: 95, angle: 0.5, extend: 38}, // Hind left pushing
        hr: {x: 75, y: 95, angle: 0.4, extend: 35} // Hind right extending
    });
}

function drawHorse13(ctx) {
    // Frame 13: Powerful hind push, front extending
    drawDetailedHorse(ctx, {
        fl: {x: 185, y: 100, angle: -0.4, extend: 25}, // Front left extending
        fr: {x: 195, y: 100, angle: -0.3, extend: 22}, // Front right reaching
        hl: {x: 65, y: 95, angle: 0.4, extend: 35}, // Hind left push-off
        hr: {x: 75, y: 95, angle: 0.3, extend: 30} // Hind right extending
    });
}

function drawHorse14(ctx) {
    // Frame 14: Transition phase
    drawDetailedHorse(ctx, {
        fl: {x: 185, y: 100, angle: -0.4, extend: 22}, // Front legs moving
        fr: {x: 195, y: 100, angle: -0.2, extend: 18}, // forward
        hl: {x: 65, y: 95, angle: 0.3, extend: 28}, // Hind legs
        hr: {x: 75, y: 95, angle: 0.2, extend: 25} // following through
    });
}

function drawHorse15(ctx) {
    // Frame 15: Completing cycle, returning to start
    drawDetailedHorse(ctx, {
        fl: {x: 185, y: 100, angle: -0.3, extend: 18}, // Front left
        fr: {x: 195, y: 100, angle: -0.2, extend: 15}, // Front right
        hl: {x: 65, y: 95, angle: 0.3, extend: 30}, // Hind left
        hr: {x: 75, y: 95, angle: 0.2, extend: 28} // Hind right - back to frame 0
    });
}

        // Create array of all horse drawing functions
        const horseFrames = [];
        for (let i = 0; i < 16; i++) {
            horseFrames.push(createHorseFrame(i));
        }

        // DECISION: Three viewing modes with easy switching
        // RATIONALE:
        //   - ANIMATED: Primary exhibition mode, single horse loops continuously
        //   - GRID: Study mode showing all 16 frames simultaneously
        //   - HYBRID: Both animated and grid, with current frame highlighted

        function drawAnimatedMode() {
            ctx.fillStyle = '#f4ead5';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw single horse centered and large
            // New horse is ~250 units wide, ~200 units tall (including legs)
            const scale = 3.2; // Scale up for canvas
            const offsetX = canvas.width / 2 - 135 * scale; // Horse center at X=135
            const offsetY = canvas.height / 2 - 115 * scale; // Horse center at Y=115

            horseFrames[currentFrame](ctx, scale, offsetX, offsetY);

            // Frame number indicator
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.font = '16px Courier New';
            ctx.fillText(`Frame ${currentFrame + 1}/16`, 20, canvas.height - 20);
        }

        function drawGridMode() {
            ctx.fillStyle = '#f4ead5';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw 4x4 grid of all frames
            const cols = 4;
            const rows = 4;
            const cellWidth = canvas.width / cols;
            const cellHeight = canvas.height / rows;
            const scale = 0.9; // Smaller scale for grid view

            for (let i = 0; i < 16; i++) {
                const col = i % cols;
                const row = Math.floor(i / cols);
                const x = col * cellWidth + cellWidth / 2 - 135 * scale; // New horse center
                const y = row * cellHeight + cellHeight / 2 - 115 * scale;

                // Highlight current frame
                if (i === currentFrame && isPlaying) {
                    ctx.fillStyle = 'rgba(139, 115, 85, 0.2)';
                    ctx.fillRect(col * cellWidth, row * cellHeight, cellWidth, cellHeight);
                }

                horseFrames[i](ctx, scale, x, y);

                // Frame numbers
                ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                ctx.font = '12px Courier New';
                ctx.fillText((i + 1).toString(), col * cellWidth + 10, row * cellHeight + 25);
            }
        }

        function drawHybridMode() {
            ctx.fillStyle = '#f4ead5';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Top half: Large animated horse
            ctx.save();
            ctx.rect(0, 0, canvas.width, canvas.height / 2);
            ctx.clip();

            const scale1 = 2.4; // Updated for new horse size
            const offsetX1 = canvas.width / 2 - 135 * scale1;
            const offsetY1 = canvas.height / 4 - 115 * scale1;
            horseFrames[currentFrame](ctx, scale1, offsetX1, offsetY1);

            ctx.restore();

            // Divider line
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, canvas.height / 2);
            ctx.lineTo(canvas.width, canvas.height / 2);
            ctx.stroke();

            // Bottom half: Grid of all frames
            const cols = 8;
            const rows = 2;
            const cellWidth = canvas.width / cols;
            const cellHeight = (canvas.height / 2) / rows;
            const scale2 = 0.5; // Smaller for 8x2 grid

            for (let i = 0; i < 16; i++) {
                const col = i % cols;
                const row = Math.floor(i / cols);
                const x = col * cellWidth + cellWidth / 2 - 135 * scale2; // New horse center
                const y = canvas.height / 2 + row * cellHeight + cellHeight / 2 - 115 * scale2;

                // Highlight current frame
                if (i === currentFrame) {
                    ctx.fillStyle = 'rgba(139, 115, 85, 0.3)';
                    ctx.fillRect(col * cellWidth, canvas.height / 2 + row * cellHeight, cellWidth, cellHeight);
                }

                horseFrames[i](ctx, scale2, x, y);
            }
        }

        function draw() {
            switch(mode) {
                case 'animated':
                    drawAnimatedMode();
                    break;
                case 'grid':
                    drawGridMode();
                    break;
                case 'hybrid':
                    drawHybridMode();
                    break;
            }
        }

        // Animation loop
        function animate(timestamp) {
            if (isPlaying) {
                const frameInterval = 1000 / fps;
                if (timestamp - lastFrameTime >= frameInterval) {
                    currentFrame = (currentFrame + 1) % 16;
                    lastFrameTime = timestamp;
                }
            }

            draw();
            requestAnimationFrame(animate);
        }

        // UI Controls
        document.getElementById('modeAnimated').addEventListener('click', () => {
            mode = 'animated';
            updateModeButtons();
        });

        document.getElementById('modeGrid').addEventListener('click', () => {
            mode = 'grid';
            updateModeButtons();
        });

        document.getElementById('modeHybrid').addEventListener('click', () => {
            mode = 'hybrid';
            updateModeButtons();
        });

        function updateModeButtons() {
            document.querySelectorAll('.button-group button').forEach(btn => {
                btn.classList.remove('active');
            });
            if (mode === 'animated') document.getElementById('modeAnimated').classList.add('active');
            if (mode === 'grid') document.getElementById('modeGrid').classList.add('active');
            if (mode === 'hybrid') document.getElementById('modeHybrid').classList.add('active');
        }

        document.getElementById('playPause').addEventListener('click', () => {
            isPlaying = !isPlaying;
            document.getElementById('playPause').textContent = isPlaying ? 'Pause' : 'Play';
        });

        document.getElementById('prevFrame').addEventListener('click', () => {
            currentFrame = (currentFrame - 1 + 16) % 16;
            draw();
        });

        document.getElementById('nextFrame').addEventListener('click', () => {
            currentFrame = (currentFrame + 1) % 16;
            draw();
        });

        document.getElementById('fpsSlider').addEventListener('input', (e) => {
            fps = parseInt(e.target.value);
            document.getElementById('fpsDisplay').textContent = `${fps} FPS`;
        });

        document.getElementById('fullscreen').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
                document.getElementById('fullscreen').textContent = 'Exit Fullscreen';
            } else {
                document.exitFullscreen();
                document.getElementById('fullscreen').textContent = 'Enter Fullscreen';
            }
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case ' ':
                    e.preventDefault();
                    isPlaying = !isPlaying;
                    document.getElementById('playPause').textContent = isPlaying ? 'Pause' : 'Play';
                    break;
                case '1':
                    mode = 'animated';
                    updateModeButtons();
                    break;
                case '2':
                    mode = 'grid';
                    updateModeButtons();
                    break;
                case '3':
                    mode = 'hybrid';
                    updateModeButtons();
                    break;
                case 'ArrowLeft':
                    e.preventDefault();
                    currentFrame = (currentFrame - 1 + 16) % 16;
                    draw();
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    currentFrame = (currentFrame + 1) % 16;
                    draw();
                    break;
                case 'f':
                case 'F':
                    if (!document.fullscreenElement) {
                        document.documentElement.requestFullscreen();
                    } else {
                        document.exitFullscreen();
                    }
                    break;
            }
        });

        // Listen for fullscreen changes
        document.addEventListener('fullscreenchange', () => {
            document.getElementById('fullscreen').textContent =
                document.fullscreenElement ? 'Exit Fullscreen' : 'Enter Fullscreen';
        });

        // Start animation
        requestAnimationFrame(animate);

        // DECISION LOG SUMMARY:
        // - Canvas: 1080x1080 square format
        // - Frames: 16 hand-coded horse silhouettes
        // - Style: Black silhouettes on sepia (#f4ead5)
        // - Modes: Three viewing modes (animated/grid/hybrid)
        // - Controls: FPS slider (2-24), play/pause, frame navigation
        // - Keyboard shortcuts for exhibition use
        // - Fullscreen support for installation display

    </script>
</body>
</html>
