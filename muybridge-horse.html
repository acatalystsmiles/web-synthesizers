<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muybridge Horse - Galloping Study (1878)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #2a2520;
            color: #e8dcc8;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            max-width: 1200px;
        }

        .title {
            text-align: center;
            margin-bottom: 10px;
        }

        .title h1 {
            font-size: 24px;
            font-weight: normal;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .title p {
            font-size: 12px;
            opacity: 0.7;
            font-style: italic;
        }

        .canvas-wrapper {
            background: #f4ead5;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        /* Film strip sprocket holes */
        .canvas-wrapper::before,
        .canvas-wrapper::after {
            content: '';
            position: absolute;
            top: 50px;
            bottom: 50px;
            width: 15px;
            background: repeating-linear-gradient(
                to bottom,
                transparent 0px,
                transparent 10px,
                #2a2520 10px,
                #2a2520 20px
            );
        }

        .canvas-wrapper::before {
            left: 10px;
        }

        .canvas-wrapper::after {
            right: 10px;
        }

        canvas {
            display: block;
            border-radius: 10px;
            background: #f4ead5;
        }

        .controls {
            background: rgba(244, 234, 213, 0.1);
            padding: 20px 30px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-width: 500px;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 15px;
            justify-content: space-between;
        }

        .control-group label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        button {
            background: #e8dcc8;
            color: #2a2520;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s;
        }

        button:hover {
            background: #d4c7b0;
            transform: translateY(-1px);
        }

        button.active {
            background: #8b7355;
            color: #f4ead5;
        }

        input[type="range"] {
            flex: 1;
            min-width: 150px;
        }

        .button-group {
            display: flex;
            gap: 8px;
        }

        .info {
            font-size: 11px;
            opacity: 0.6;
            text-align: center;
            max-width: 600px;
            line-height: 1.6;
        }

        .fps-display {
            font-size: 12px;
            min-width: 60px;
            text-align: right;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .controls {
                min-width: auto;
                width: 100%;
            }

            .control-group {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">
            <h1>THE HORSE IN MOTION</h1>
            <p>After Eadweard Muybridge, 1878</p>
        </div>

        <div class="canvas-wrapper">
            <canvas id="canvas" width="1080" height="1080"></canvas>
        </div>

        <div class="controls">
            <div class="control-group">
                <label>View Mode:</label>
                <div class="button-group">
                    <button id="modeAnimated" class="active">Animated</button>
                    <button id="modeGrid">Grid</button>
                    <button id="modeHybrid">Hybrid</button>
                </div>
            </div>

            <div class="control-group">
                <label>Playback:</label>
                <div class="button-group">
                    <button id="playPause">Pause</button>
                    <button id="prevFrame">← Prev</button>
                    <button id="nextFrame">Next →</button>
                </div>
            </div>

            <div class="control-group">
                <label>Speed (FPS):</label>
                <input type="range" id="fpsSlider" min="2" max="24" value="12" step="1">
                <span class="fps-display" id="fpsDisplay">12 FPS</span>
            </div>

            <div class="control-group">
                <button id="fullscreen">Enter Fullscreen</button>
            </div>
        </div>

        <div class="info">
            Keyboard: [SPACE] Play/Pause • [1] Animated • [2] Grid • [3] Hybrid • [←/→] Navigate Frames • [F] Fullscreen
        </div>
    </div>

    <script>
        // ============================================
        // MUYBRIDGE HORSE ANIMATION
        // Decision Log embedded in code comments
        // ============================================

        // DECISION: Canvas resolution set to 1080x1080
        // RATIONALE: Largest square that fits within 1920x1080 target resolution.
        //            Square format honors the film frame aesthetic and works well
        //            for exhibition display centered on standard screens.

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // DECISION: 16 frames for complete gallop cycle
        // RATIONALE: Muybridge's original studies used 12-16 frames. 16 provides
        //            smooth motion while maintaining the sequential study aesthetic.
        //            Each frame represents approximately 1/16 of a second at gallop speed.

        // Animation state
        let currentFrame = 0;
        let isPlaying = true;
        let fps = 12;
        let mode = 'animated'; // 'animated', 'grid', or 'hybrid'
        let lastFrameTime = 0;

        // DECISION: Horse silhouettes coded as simplified vector paths
        // RATIONALE: Each frame hand-coded as path coordinates representing
        //            key positions in the gallop cycle. Silhouette style matches
        //            Muybridge's high-contrast photography aesthetic.
        //
        // Gallop cycle phases:
        // Frames 0-3: Gathered/compression phase
        // Frames 4-7: Extension phase (including "floating" moment)
        // Frames 8-11: Mid-stride phase
        // Frames 12-15: Recovery/gathering phase

        function createHorseFrame(frameIndex) {
            // Returns a function that draws the horse for this frame
            // Each horse is designed to fit in a normalized coordinate space
            // that will be scaled to fit the canvas

            return function(ctx, scale, offsetX, offsetY) {
                ctx.save();
                ctx.translate(offsetX, offsetY);
                ctx.scale(scale, scale);
                ctx.fillStyle = '#000000';
                ctx.beginPath();

                // UPDATED: Detailed anatomically accurate horse ~300 units wide, ~180 units tall
                // Based on Muybridge studies and proper horse anatomy research
                switch(frameIndex) {
                    case 0: // Gathered position - all legs under body
                        drawHorse0(ctx);
                        break;
                    case 1: // Starting to extend front
                        drawHorse1(ctx);
                        break;
                    case 2: // Front legs extending forward
                        drawHorse2(ctx);
                        break;
                    case 3: // Front extended, back gathering
                        drawHorse3(ctx);
                        break;
                    case 4: // Front touching down, back extending
                        drawHorse4(ctx);
                        break;
                    case 5: // Weight on front, back extending
                        drawHorse5(ctx);
                        break;
                    case 6: // Mid extension
                        drawHorse6(ctx);
                        break;
                    case 7: // All legs extended - "floating" phase
                        drawHorse7(ctx);
                        break;
                    case 8: // Back legs forward, front lifting
                        drawHorse8(ctx);
                        break;
                    case 9: // Back legs under, front legs gathering
                        drawHorse9(ctx);
                        break;
                    case 10: // Back supporting, front gathering
                        drawHorse10(ctx);
                        break;
                    case 11: // Weight on back, front extending
                        drawHorse11(ctx);
                        break;
                    case 12: // Back pushing off, front reaching
                        drawHorse12(ctx);
                        break;
                    case 13: // Extension phase beginning
                        drawHorse13(ctx);
                        break;
                    case 14: // All legs gathering
                        drawHorse14(ctx);
                        break;
                    case 15: // Return to gathered position
                        drawHorse15(ctx);
                        break;
                }

                ctx.fill();
                ctx.restore();
            };
        }

        // COLLEGIATE-LEVEL ARTISTIC HORSE SILHOUETTES
        // Hand-crafted with anatomical precision and artistic attention
        // Based on deep study of equine biomechanics and Muybridge's work

        // Advanced articulated body system with visible muscle definition
        function drawArticulatedBody(ctx, config) {
            // config: {compression, headAngle, neckArch, tailAngle}
            // compression: 0 (extended) to 1 (compressed/gathered)

            let comp = config.compression || 0;
            let headAng = config.headAngle || 0;
            let neckArch = config.neckArch || 0.5;
            let tailAng = config.tailAngle || 0;

            // Body length changes with compression
            let bodyLen = 130 - (comp * 15); // Compresses when gathered
            let backArch = comp * 4; // Back arches more when compressed

            // HINDQUARTERS - powerful, muscular
            ctx.moveTo(45, 88 + backArch); // Tail dock
            ctx.bezierCurveTo(43, 85 + backArch, 42, 82 + backArch, 44, 79 + backArch); // Croup - rounded muscle
            ctx.bezierCurveTo(49, 74 + backArch, 56, 70 + backArch, 65, 68 + backArch); // Point of hip visible

            // BACK/LOIN - shows spine curvature
            ctx.bezierCurveTo(80, 66 + backArch, 96, 64 + backArch/2, 112, 63); // Loin curves
            ctx.bezierCurveTo(128, 62 - backArch/2, 144, 61 - backArch, 160, 60 - backArch); // Back

            // WITHERS - highest point, prominent
            ctx.bezierCurveTo(168, 59 - backArch, 176, 59 - backArch, 184, 60 - backArch/2); // Withers rise

            // SHOULDER - large muscle mass visible
            ctx.bezierCurveTo(192, 61, 199, 64, 205, 68); // Shoulder blade top
            ctx.bezierCurveTo(211, 72, 216, 77, 220, 83); // Shoulder muscle bulge
            ctx.bezierCurveTo(224, 89, 226, 96, 227, 103); // Point of shoulder

            // CHEST - deep, powerful
            ctx.bezierCurveTo(228, 111, 227, 119, 224, 126); // Chest depth

            // UNDERLINE - belly/girth
            ctx.bezierCurveTo(219, 132, 212, 136, 203, 139); // Girth
            ctx.bezierCurveTo(190, 141, 176, 142, 162, 142); // Belly
            ctx.bezierCurveTo(145, 141, 128, 139, 112, 136); // Flank
            ctx.bezierCurveTo(95, 133, 79, 129, 65, 123); // Hindquarter underline
            ctx.bezierCurveTo(55, 118, 48, 112, 44, 105); // Stifle area
            ctx.bezierCurveTo(42, 98, 43, 92, 45, 88 + backArch); // Close

            // NECK - arched, muscular, responds to head position
            let neckBase = 184;
            let neckX = neckBase;
            let neckY = 60 - backArch/2;

            ctx.moveTo(neckX, neckY); // Base at withers
            ctx.bezierCurveTo(
                neckX + 8, neckY - 8 - neckArch*4,
                neckX + 18, neckY - 14 - neckArch*6,
                neckX + 30, neckY - 18 - neckArch*5
            ); // Crest - powerful arch

            ctx.bezierCurveTo(
                neckX + 40, neckY - 20 - neckArch*3,
                neckX + 50, neckY - 21 - neckArch*2 + headAng*5,
                neckX + 60, neckY - 20 + headAng*8
            ); // Poll to head

            // HEAD - detailed with muzzle, jaw
            let headX = neckX + 60;
            let headY = neckY - 20 + headAng*8;

            ctx.bezierCurveTo(headX + 6, headY + 1, headX + 11, headY + 3, headX + 15, headY + 6); // Forehead
            ctx.bezierCurveTo(headX + 19, headY + 9, headX + 22, headY + 13, headX + 24, headY + 17); // Face
            ctx.lineTo(headX + 26, headY + 21); // Nostril
            ctx.bezierCurveTo(headX + 25, headY + 24, headX + 22, headY + 26, headX + 18, headY + 27); // Muzzle
            ctx.bezierCurveTo(headX + 14, headY + 27, headX + 10, headY + 25, headX + 6, headY + 23); // Lower jaw
            ctx.bezierCurveTo(headX, headY + 21, headX - 6, headY + 20, headX - 12, headY + 20); // Throatlatch

            // Under neck - windpipe visible
            ctx.bezierCurveTo(
                headX - 20, headY + 22,
                headX - 30, headY + 26,
                headX - 40, headY + 32
            );
            ctx.bezierCurveTo(
                headX - 50, headY + 38,
                neckX + 20, neckY + 32,
                neckX + 10, neckY + 35
            );
            ctx.bezierCurveTo(neckX + 5, neckY + 30, neckX + 2, neckY + 20, neckX, neckY); // Back to withers

            // EAR - alert
            ctx.moveTo(headX + 50, headY - 16);
            ctx.lineTo(headX + 49, headY - 22);
            ctx.lineTo(headX + 52, headY - 18);

            // TAIL - flows with momentum
            let tailX = 45;
            let tailY = 85 + backArch;
            ctx.moveTo(tailX, tailY);
            ctx.quadraticCurveTo(
                tailX - 12 + tailAng*5, tailY + 8,
                tailX - 20 + tailAng*8, tailY + 18
            );
            ctx.quadraticCurveTo(
                tailX - 26 + tailAng*10, tailY + 26,
                tailX - 30 + tailAng*12, tailY + 36
            );
            ctx.quadraticCurveTo(
                tailX - 32 + tailAng*12, tailY + 44,
                tailX - 33 + tailAng*12, tailY + 52
            );
            // Return
            ctx.quadraticCurveTo(
                tailX - 31 + tailAng*12, tailY + 48,
                tailX - 28 + tailAng*11, tailY + 42
            );
            ctx.quadraticCurveTo(
                tailX - 23 + tailAng*9, tailY + 32,
                tailX - 17 + tailAng*7, tailY + 23
            );
            ctx.quadraticCurveTo(
                tailX - 10 + tailAng*4, tailY + 13,
                tailX - 2, tailY + 5
            );
        }

        // Sophisticated leg with visible joints and muscle definition
        function drawAnatomicalLeg(ctx, config) {
            // config: {x, y, type, phase, weight}
            // type: 'front' or 'hind'
            // phase: 0-1 through stride (0=gathered, 0.5=extended, 1=gathered)
            // weight: 0-1 (0=swing, 1=full weight bearing)

            ctx.save();
            ctx.translate(config.x, config.y);

            let isHind = config.type === 'hind';
            let phase = config.phase || 0;
            let weight = config.weight || 0;

            // Joint angles change through stride
            let upperAngle, lowerAngle, cannonAngle;

            if (isHind) {
                // Hind leg - more angulated, provides propulsion
                if (phase < 0.3) { // Gathered/lifting
                    upperAngle = -0.3; lowerAngle = 0.8; cannonAngle = 0.4;
                } else if (phase < 0.7) { // Extended/pushing
                    upperAngle = 0.5; lowerAngle = -0.2; cannonAngle = -0.1;
                } else { // Returning
                    upperAngle = 0.2; lowerAngle = 0.5; cannonAngle = 0.3;
                }
            } else {
                // Front leg - straighter, weight bearing
                if (phase < 0.3) { // Gathered
                    upperAngle = -0.4; lowerAngle = 0.6; cannonAngle = 0.3;
                } else if (phase < 0.7) { // Extended
                    upperAngle = 0.3; lowerAngle = -0.1; cannonAngle = 0;
                } else { // Returning
                    upperAngle = 0; lowerAngle = 0.4; cannonAngle = 0.2;
                }
            }

            // Muscle bulge when weight-bearing
            let muscleBulge = weight * 3;

            // Upper segment (femur/humerus)
            let upperLen = isHind ? 40 : 38;
            let upperX = Math.sin(upperAngle) * upperLen;
            let upperY = Math.cos(upperAngle) * upperLen;

            ctx.moveTo(-3, 0);
            ctx.quadraticCurveTo(
                upperX * 0.3 - 4 - muscleBulge,
                upperY * 0.3,
                upperX - 3,
                upperY
            );

            // Lower segment (tibia/radius)
            let lowerLen = isHind ? 42 : 40;
            let lowerX = upperX + Math.sin(upperAngle + lowerAngle) * lowerLen;
            let lowerY = upperY + Math.cos(upperAngle + lowerAngle) * lowerLen;

            ctx.lineTo(lowerX - 2, lowerY);

            // Cannon (metacarpal/metatarsal)
            let cannonLen = 48;
            let cannonX = lowerX + Math.sin(upperAngle + lowerAngle + cannonAngle) * cannonLen;
            let cannonY = lowerY + Math.cos(upperAngle + lowerAngle + cannonAngle) * cannonLen;

            ctx.lineTo(cannonX - 1, cannonY);

            // Hoof
            ctx.lineTo(cannonX + 1, cannonY + 10);
            ctx.lineTo(cannonX + 5, cannonY + 10);
            ctx.lineTo(cannonX + 5, cannonY);

            // Back of leg - shows tendons
            ctx.lineTo(lowerX + 4, lowerY);
            ctx.quadraticCurveTo(
                upperX * 0.7 + 5,
                upperY * 0.7,
                upperX + 4,
                upperY
            );
            ctx.quadraticCurveTo(
                upperX * 0.3 + 3 + muscleBulge,
                upperY * 0.3,
                3,
                0
            );
            ctx.closePath();

            ctx.restore();
        }

        // Master drawing function
        function drawArtisticHorse(ctx, bodyConfig, legs) {
            ctx.beginPath();
            drawArticulatedBody(ctx, bodyConfig);

            // Draw legs with proper layering (back legs first)
            drawAnatomicalLeg(ctx, legs.hr);
            drawAnatomicalLeg(ctx, legs.hl);
            drawAnatomicalLeg(ctx, legs.fr);
            drawAnatomicalLeg(ctx, legs.fl);
        }


function drawHorse0(ctx) {
    // Frame 0: Right hind pushing off - body compressing, gathering power
    drawArtisticHorse(ctx,
        {compression: 0.4, headAngle: 0.1, neckArch: 0.6, tailAngle: 0.3},
        {
            fl: {x: 220, y: 126, type: 'front', phase: 0.25, weight: 0.1}, // Lifting
            fr: {x: 227, y: 126, type: 'front', phase: 0.15, weight: 0.05}, // Gathered
            hl: {x: 62, y: 120, type: 'hind', phase: 0.65, weight: 0.2}, // Extended, pushing
            hr: {x: 70, y: 120, type: 'hind', phase: 0.55, weight: 0.8} // Weight-bearing, pushing
        }
    );
}

function drawHorse1(ctx) {
    // Frame 1: Both hinds pushing, body extending forward
    drawArtisticHorse(ctx,
        {compression: 0.3, headAngle: 0.15, neckArch: 0.65, tailAngle: 0.4},
        {
            fl: {x: 220, y: 126, type: 'front', phase: 0.3, weight: 0.15},
            fr: {x: 227, y: 126, type: 'front', phase: 0.2, weight: 0.1},
            hl: {x: 62, y: 120, type: 'hind', phase: 0.7, weight: 0.25},
            hr: {x: 70, y: 120, type: 'hind', phase: 0.6, weight: 0.9}
        }
    );
}

function drawHorse2(ctx) {
    // Frame 2: Hinds leaving ground, front legs reaching
    drawArtisticHorse(ctx,
        {compression: 0.15, headAngle: 0.2, neckArch: 0.7, tailAngle: 0.5},
        {
            fl: {x: 220, y: 126, type: 'front', phase: 0.45, weight: 0.3},
            fr: {x: 227, y: 126, type: 'front', phase: 0.35, weight: 0.25},
            hl: {x: 62, y: 120, type: 'hind', phase: 0.75, weight: 0.05},
            hr: {x: 70, y: 120, type: 'hind', phase: 0.7, weight: 0.1}
        }
    );
}

function drawHorse3(ctx) {
    // Frame 3: Front legs extended, body elongating
    drawArtisticHorse(ctx,
        {compression: 0.05, headAngle: 0.25, neckArch: 0.75, tailAngle: 0.6},
        {
            fl: {x: 220, y: 126, type: 'front', phase: 0.55, weight: 0.5},
            fr: {x: 227, y: 126, type: 'front', phase: 0.5, weight: 0.45},
            hl: {x: 62, y: 120, type: 'hind', phase: 0.9, weight: 0},
            hr: {x: 70, y: 120, type: 'hind', phase: 0.85, weight: 0}
        }
    );
}

function drawHorse4(ctx) {
    // Frame 4: SUSPENSION - all legs gathered (Muybridge's discovery!)
    drawArtisticHorse(ctx,
        {compression: 0.7, headAngle: 0.3, neckArch: 0.8, tailAngle: 0.7},
        {
            fl: {x: 220, y: 126, type: 'front', phase: 0.15, weight: 0},
            fr: {x: 227, y: 126, type: 'front', phase: 0.1, weight: 0},
            hl: {x: 62, y: 120, type: 'hind', phase: 0.1, weight: 0},
            hr: {x: 70, y: 120, type: 'hind', phase: 0.15, weight: 0}
        }
    );
}

function drawHorse5(ctx) {
    // Frame 5: Front legs extending downward
    drawArtisticHorse(ctx,
        {compression: 0.5, headAngle: 0.25, neckArch: 0.75, tailAngle: 0.65},
        {
            fl: {x: 220, y: 126, type: 'front', phase: 0.5, weight: 0.1},
            fr: {x: 227, y: 126, type: 'front', phase: 0.45, weight: 0.05},
            hl: {x: 62, y: 120, type: 'hind', phase: 0.2, weight: 0},
            hr: {x: 70, y: 120, type: 'hind', phase: 0.25, weight: 0}
        }
    );
}

function drawHorse6(ctx) {
    // Frame 6: Front left landing, taking weight
    drawArtisticHorse(ctx,
        {compression: 0.3, headAngle: 0.2, neckArch: 0.7, tailAngle: 0.6},
        {
            fl: {x: 220, y: 126, type: 'front', phase: 0.65, weight: 0.7},
            fr: {x: 227, y: 126, type: 'front', phase: 0.6, weight: 0.5},
            hl: {x: 62, y: 120, type: 'hind', phase: 0.3, weight: 0},
            hr: {x: 70, y: 120, type: 'hind', phase: 0.35, weight: 0}
        }
    );
}

function drawHorse7(ctx) {
    // Frame 7: Weight on front legs, hind swinging forward
    drawArtisticHorse(ctx,
        {compression: 0.15, headAngle: 0.15, neckArch: 0.65, tailAngle: 0.5},
        {
            fl: {x: 220, y: 126, type: 'front', phase: 0.7, weight: 0.9},
            fr: {x: 227, y: 126, type: 'front', phase: 0.65, weight: 0.85},
            hl: {x: 62, y: 120, type: 'hind', phase: 0.4, weight: 0},
            hr: {x: 70, y: 120, type: 'hind', phase: 0.45, weight: 0}
        }
    );
}

function drawHorse8(ctx) {
    // Frame 8: Hind legs coming under body
    drawArtisticHorse(ctx,
        {compression: 0.1, headAngle: 0.1, neckArch: 0.6, tailAngle: 0.4},
        {
            fl: {x: 220, y: 126, type: 'front', phase: 0.65, weight: 0.8},
            fr: {x: 227, y: 126, type: 'front', phase: 0.6, weight: 0.75},
            hl: {x: 62, y: 120, type: 'hind', phase: 0.5, weight: 0.1},
            hr: {x: 70, y: 120, type: 'hind', phase: 0.55, weight: 0.15}
        }
    );
}

function drawHorse9(ctx) {
    // Frame 9: Hind legs approaching ground
    drawArtisticHorse(ctx,
        {compression: 0.2, headAngle: 0.05, neckArch: 0.55, tailAngle: 0.3},
        {
            fl: {x: 220, y: 126, type: 'front', phase: 0.5, weight: 0.6},
            fr: {x: 227, y: 126, type: 'front', phase: 0.45, weight: 0.55},
            hl: {x: 62, y: 120, type: 'hind', phase: 0.6, weight: 0.3},
            hr: {x: 70, y: 120, type: 'hind', phase: 0.65, weight: 0.35}
        }
    );
}

function drawHorse10(ctx) {
    // Frame 10: Weight transferring to hind legs
    drawArtisticHorse(ctx,
        {compression: 0.35, headAngle: 0, neckArch: 0.5, tailAngle: 0.25},
        {
            fl: {x: 220, y: 126, type: 'front', phase: 0.3, weight: 0.3},
            fr: {x: 227, y: 126, type: 'front', phase: 0.25, weight: 0.25},
            hl: {x: 62, y: 120, type: 'hind', phase: 0.7, weight: 0.7},
            hr: {x: 70, y: 120, type: 'hind', phase: 0.75, weight: 0.75}
        }
    );
}

function drawHorse11(ctx) {
    // Frame 11: Hind legs supporting, front gathering
    drawArtisticHorse(ctx,
        {compression: 0.5, headAngle: -0.05, neckArch: 0.45, tailAngle: 0.2},
        {
            fl: {x: 220, y: 126, type: 'front', phase: 0.15, weight: 0.1},
            fr: {x: 227, y: 126, type: 'front', phase: 0.1, weight: 0.05},
            hl: {x: 62, y: 120, type: 'hind', phase: 0.65, weight: 0.9},
            hr: {x: 70, y: 120, type: 'hind', phase: 0.65, weight: 0.95}
        }
    );
}

function drawHorse12(ctx) {
    // Frame 12: Hind pushing off powerfully
    drawArtisticHorse(ctx,
        {compression: 0.45, headAngle: 0, neckArch: 0.55, tailAngle: 0.3},
        {
            fl: {x: 220, y: 126, type: 'front', phase: 0.25, weight: 0.15},

            hr: {x: 70, y: 120, type: 'hind', phase: 0.55, weight: 0.8}
        }
    );
}

function drawHorse13(ctx) {
    // Frame 13: Maximum extension beginning
    drawArtisticHorse(ctx,
        {compression: 0.35, headAngle: 0.05, neckArch: 0.6, tailAngle: 0.35},
        {
            fl: {x: 220, y: 126, type: 'front', phase: 0.35, weight: 0.2},
            fr: {x: 227, y: 126, type: 'front', phase: 0.3, weight: 0.15},

    drawArtisticHorse(ctx,
        {compression: 0.4, headAngle: 0.08, neckArch: 0.58, tailAngle: 0.32},
        {
            fl: {x: 220, y: 126, type: 'front', phase: 0.28, weight: 0.12},
            fr: {x: 227, y: 126, type: 'front', phase: 0.22, weight: 0.08},

}

function drawHorse15(ctx) {
    // Frame 15: Completing cycle, flowing back to frame 0
    drawArtisticHorse(ctx,
        {compression: 0.42, headAngle: 0.1, neckArch: 0.6, tailAngle: 0.3},
        {
            fl: {x: 220, y: 126, type: 'front', phase: 0.26, weight: 0.1},
            fr: {x: 227, y: 126, type: 'front', phase: 0.18, weight: 0.06},
            hl: {x: 62, y: 120, type: 'hind', phase: 0.64, weight: 0.25},
            hr: {x: 70, y: 120, type: 'hind', phase: 0.56, weight: 0.75}
        }
    );
}

        // Create array of all horse drawing functions
        const horseFrames = [];
        for (let i = 0; i < 16; i++) {
            horseFrames.push(createHorseFrame(i));
        }

        // DECISION: Three viewing modes with easy switching
        // RATIONALE:
        //   - ANIMATED: Primary exhibition mode, single horse loops continuously
        //   - GRID: Study mode showing all 16 frames simultaneously
        //   - HYBRID: Both animated and grid, with current frame highlighted

        function drawAnimatedMode() {
            ctx.fillStyle = '#f4ead5';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw single horse centered and large
            // Artistic horse is ~226 units wide, ~210 units tall (including legs)
            const scale = 3.5; // Scale up for canvas
            const offsetX = canvas.width / 2 - 157 * scale; // Horse center at X=157
            const offsetY = canvas.height / 2 - 125 * scale; // Horse center at Y=125

            horseFrames[currentFrame](ctx, scale, offsetX, offsetY);

            // Frame number indicator
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.font = '16px Courier New';
            ctx.fillText(`Frame ${currentFrame + 1}/16`, 20, canvas.height - 20);
        }

        function drawGridMode() {
            ctx.fillStyle = '#f4ead5';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw 4x4 grid of all frames
            const cols = 4;
            const rows = 4;
            const cellWidth = canvas.width / cols;
            const cellHeight = canvas.height / rows;
            const scale = 0.85; // Scale for grid view

            for (let i = 0; i < 16; i++) {
                const col = i % cols;
                const row = Math.floor(i / cols);
                const x = col * cellWidth + cellWidth / 2 - 157 * scale; // Artistic horse center
                const y = row * cellHeight + cellHeight / 2 - 125 * scale;

                // Highlight current frame
                if (i === currentFrame && isPlaying) {
                    ctx.fillStyle = 'rgba(139, 115, 85, 0.2)';
                    ctx.fillRect(col * cellWidth, row * cellHeight, cellWidth, cellHeight);
                }

                horseFrames[i](ctx, scale, x, y);

                // Frame numbers
                ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                ctx.font = '12px Courier New';
                ctx.fillText((i + 1).toString(), col * cellWidth + 10, row * cellHeight + 25);
            }
        }

        function drawHybridMode() {
            ctx.fillStyle = '#f4ead5';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Top half: Large animated horse
            ctx.save();
            ctx.rect(0, 0, canvas.width, canvas.height / 2);
            ctx.clip();

            const scale1 = 2.6; // Artistic horse size
            const offsetX1 = canvas.width / 2 - 157 * scale1;
            const offsetY1 = canvas.height / 4 - 125 * scale1;
            horseFrames[currentFrame](ctx, scale1, offsetX1, offsetY1);

            ctx.restore();

            // Divider line
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, canvas.height / 2);
            ctx.lineTo(canvas.width, canvas.height / 2);
            ctx.stroke();

            // Bottom half: Grid of all frames
            const cols = 8;
            const rows = 2;
            const cellWidth = canvas.width / cols;
            const cellHeight = (canvas.height / 2) / rows;
            const scale2 = 0.48; // Small scale for 8x2 grid

            for (let i = 0; i < 16; i++) {
                const col = i % cols;
                const row = Math.floor(i / cols);
                const x = col * cellWidth + cellWidth / 2 - 157 * scale2; // Artistic horse center
                const y = canvas.height / 2 + row * cellHeight + cellHeight / 2 - 125 * scale2;

                // Highlight current frame
                if (i === currentFrame) {
                    ctx.fillStyle = 'rgba(139, 115, 85, 0.3)';
                    ctx.fillRect(col * cellWidth, canvas.height / 2 + row * cellHeight, cellWidth, cellHeight);
                }

                horseFrames[i](ctx, scale2, x, y);
            }
        }

        function draw() {
            switch(mode) {
                case 'animated':
                    drawAnimatedMode();
                    break;
                case 'grid':
                    drawGridMode();
                    break;
                case 'hybrid':
                    drawHybridMode();
                    break;
            }
        }

        // Animation loop
        function animate(timestamp) {
            if (isPlaying) {
                const frameInterval = 1000 / fps;
                if (timestamp - lastFrameTime >= frameInterval) {
                    currentFrame = (currentFrame + 1) % 16;
                    lastFrameTime = timestamp;
                }
            }

            draw();
            requestAnimationFrame(animate);
        }

        // UI Controls
        document.getElementById('modeAnimated').addEventListener('click', () => {
            mode = 'animated';
            updateModeButtons();
        });

        document.getElementById('modeGrid').addEventListener('click', () => {
            mode = 'grid';
            updateModeButtons();
        });

        document.getElementById('modeHybrid').addEventListener('click', () => {
            mode = 'hybrid';
            updateModeButtons();
        });

        function updateModeButtons() {
            document.querySelectorAll('.button-group button').forEach(btn => {
                btn.classList.remove('active');
            });
            if (mode === 'animated') document.getElementById('modeAnimated').classList.add('active');
            if (mode === 'grid') document.getElementById('modeGrid').classList.add('active');
            if (mode === 'hybrid') document.getElementById('modeHybrid').classList.add('active');
        }

        document.getElementById('playPause').addEventListener('click', () => {
            isPlaying = !isPlaying;
            document.getElementById('playPause').textContent = isPlaying ? 'Pause' : 'Play';
        });

        document.getElementById('prevFrame').addEventListener('click', () => {
            currentFrame = (currentFrame - 1 + 16) % 16;
            draw();
        });

        document.getElementById('nextFrame').addEventListener('click', () => {
            currentFrame = (currentFrame + 1) % 16;
            draw();
        });

        document.getElementById('fpsSlider').addEventListener('input', (e) => {
            fps = parseInt(e.target.value);
            document.getElementById('fpsDisplay').textContent = `${fps} FPS`;
        });

        document.getElementById('fullscreen').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
                document.getElementById('fullscreen').textContent = 'Exit Fullscreen';
            } else {
                document.exitFullscreen();
                document.getElementById('fullscreen').textContent = 'Enter Fullscreen';
            }
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case ' ':
                    e.preventDefault();
                    isPlaying = !isPlaying;
                    document.getElementById('playPause').textContent = isPlaying ? 'Pause' : 'Play';
                    break;
                case '1':
                    mode = 'animated';
                    updateModeButtons();
                    break;
                case '2':
                    mode = 'grid';
                    updateModeButtons();
                    break;
                case '3':
                    mode = 'hybrid';
                    updateModeButtons();
                    break;
                case 'ArrowLeft':
                    e.preventDefault();
                    currentFrame = (currentFrame - 1 + 16) % 16;
                    draw();
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    currentFrame = (currentFrame + 1) % 16;
                    draw();
                    break;
                case 'f':
                case 'F':
                    if (!document.fullscreenElement) {
                        document.documentElement.requestFullscreen();
                    } else {
                        document.exitFullscreen();
                    }
                    break;
            }
        });

        // Listen for fullscreen changes
        document.addEventListener('fullscreenchange', () => {
            document.getElementById('fullscreen').textContent =
                document.fullscreenElement ? 'Exit Fullscreen' : 'Enter Fullscreen';
        });

        // Start animation
        requestAnimationFrame(animate);

        // DECISION LOG SUMMARY:
        // - Canvas: 1080x1080 square format
        // - Frames: 16 hand-coded horse silhouettes
        // - Style: Black silhouettes on sepia (#f4ead5)
        // - Modes: Three viewing modes (animated/grid/hybrid)
        // - Controls: FPS slider (2-24), play/pause, frame navigation
        // - Keyboard shortcuts for exhibition use
        // - Fullscreen support for installation display

    </script>
</body>
