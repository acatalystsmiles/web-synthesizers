<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple DAW</title>
    <script src="Tone.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            overflow-x: hidden;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #2a2a3e 0%, #1a1a2e 100%);
            padding: 15px 25px;
            border-bottom: 2px solid #3a3a4e;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 1.5em;
            letter-spacing: 2px;
            color: #6a9bd8;
        }

        .header-controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        /* Transport Bar */
        .transport-bar {
            background: #2a2a3a;
            padding: 15px 25px;
            border-bottom: 1px solid #3a3a4a;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .transport-controls {
            display: flex;
            gap: 10px;
        }

        .transport-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid #4a4a5a;
            background: #3a3a4a;
            color: #e0e0e0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            transition: all 0.2s ease;
        }

        .transport-btn:hover {
            background: #4a4a5a;
            border-color: #6a9bd8;
        }

        .transport-btn.active {
            background: #6a9bd8;
            border-color: #6a9bd8;
            color: #1a1a1a;
        }

        .transport-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .tempo-control {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 15px;
            background: #3a3a4a;
            border-radius: 8px;
        }

        .tempo-control label {
            font-size: 0.9em;
            color: #9a9aaa;
        }

        .tempo-control input {
            width: 80px;
            background: #2a2a3a;
            border: 1px solid #4a4a5a;
            color: #e0e0e0;
            padding: 5px 10px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
        }

        .time-display {
            font-family: 'Courier New', monospace;
            font-size: 1.2em;
            color: #6a9bd8;
            padding: 8px 15px;
            background: #3a3a4a;
            border-radius: 8px;
        }

        /* Main Content Area */
        .content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Track List */
        .track-list {
            width: 350px;
            background: #222232;
            border-right: 2px solid #3a3a4a;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .track-list-header {
            padding: 15px;
            background: #2a2a3a;
            border-bottom: 1px solid #3a3a4a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .track-list-header h2 {
            font-size: 1em;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #9a9aaa;
        }

        .tracks {
            flex: 1;
            overflow-y: auto;
        }

        .track {
            background: #2a2a3a;
            margin: 10px;
            border-radius: 10px;
            padding: 15px;
            border: 2px solid #3a3a4a;
            transition: all 0.2s ease;
        }

        .track:hover {
            border-color: #4a4a5a;
        }

        .track.armed {
            border-color: #d84a4a;
            box-shadow: 0 0 15px rgba(216, 74, 74, 0.3);
        }

        .track.solo {
            border-color: #d8b84a;
        }

        .track.muted {
            opacity: 0.5;
        }

        .track-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .track-name {
            font-weight: 600;
            font-size: 1em;
            color: #e0e0e0;
        }

        .track-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            cursor: pointer;
        }

        .track-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }

        .track-control-row {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .track-control-label {
            font-size: 0.75em;
            color: #9a9aaa;
            text-transform: uppercase;
        }

        .track-fader {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            background: #3a3a4a;
            outline: none;
            border-radius: 5px;
        }

        .track-fader::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            background: #6a9bd8;
            cursor: pointer;
            border-radius: 50%;
        }

        .track-fader::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: #6a9bd8;
            cursor: pointer;
            border-radius: 50%;
            border: none;
        }

        .track-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
        }

        .track-btn {
            padding: 6px;
            font-size: 0.75em;
            font-weight: 600;
            text-transform: uppercase;
            border: 1px solid #4a4a5a;
            background: #3a3a4a;
            color: #9a9aaa;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .track-btn:hover {
            background: #4a4a5a;
        }

        .track-btn.active {
            background: #d84a4a;
            border-color: #d84a4a;
            color: #fff;
        }

        .track-btn.solo.active {
            background: #d8b84a;
            border-color: #d8b84a;
        }

        .track-btn.mute.active {
            background: #666;
            border-color: #666;
        }

        .track-instrument {
            margin-top: 10px;
            padding: 10px;
            background: #222232;
            border-radius: 5px;
            font-size: 0.85em;
        }

        .track-instrument select {
            width: 100%;
            padding: 6px;
            background: #3a3a4a;
            border: 1px solid #4a4a5a;
            color: #e0e0e0;
            border-radius: 5px;
            cursor: pointer;
        }

        .track-meter {
            margin-top: 10px;
            height: 4px;
            background: #222232;
            border-radius: 2px;
            overflow: hidden;
        }

        .track-meter-fill {
            height: 100%;
            background: linear-gradient(to right, #4ade80, #fbbf24, #ef4444);
            width: 0%;
            transition: width 0.05s ease;
        }

        /* Workspace */
        .workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #1a1a2a;
        }

        .workspace-header {
            padding: 15px 25px;
            background: #2a2a3a;
            border-bottom: 1px solid #3a3a4a;
        }

        .workspace-header h2 {
            font-size: 1em;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #9a9aaa;
        }

        .workspace-content {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
        }

        .instrument-panel {
            background: #222232;
            border-radius: 10px;
            padding: 20px;
            border: 1px solid #3a3a4a;
        }

        .no-instrument {
            text-align: center;
            padding: 60px 20px;
            color: #6a6a7a;
            font-size: 1.1em;
        }

        /* Buttons */
        button {
            padding: 10px 20px;
            font-size: 0.9em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #4a4a5a;
            color: #e0e0e0;
        }

        button:hover {
            background: #5a5a6a;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        button.primary {
            background: #6a9bd8;
            color: #fff;
        }

        button.primary:hover {
            background: #7aabf8;
        }

        button.danger {
            background: #d84a4a;
            color: #fff;
        }

        button.danger:hover {
            background: #e85a5a;
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        /* Status Bar */
        .status-bar {
            background: #2a2a3a;
            padding: 10px 25px;
            border-top: 1px solid #3a3a4a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85em;
        }

        .status-message {
            color: #9a9aaa;
        }

        .status-message.active {
            color: #6a9bd8;
        }

        .cpu-meter {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .cpu-bar {
            width: 100px;
            height: 6px;
            background: #3a3a4a;
            border-radius: 3px;
            overflow: hidden;
        }

        .cpu-bar-fill {
            height: 100%;
            background: #4ade80;
            width: 0%;
            transition: width 0.2s ease;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background: #2a2a3a;
            border-radius: 10px;
            padding: 30px;
            min-width: 400px;
            border: 2px solid #4a4a5a;
        }

        .modal h3 {
            margin-bottom: 20px;
            color: #6a9bd8;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1a2a;
        }

        ::-webkit-scrollbar-thumb {
            background: #4a4a5a;
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #5a5a6a;
        }

        /* Export Progress */
        .export-progress {
            margin-top: 15px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #3a3a4a;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #6a9bd8, #7aabf8);
            width: 0%;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- Header -->
        <div class="header">
            <h1>Simple DAW</h1>
            <div class="header-controls">
                <button id="saveProjectBtn">Save Project</button>
                <button id="loadProjectBtn">Load Project</button>
                <button class="primary" id="exportBtn">Export Mix</button>
            </div>
        </div>

        <!-- Transport Bar -->
        <div class="transport-bar">
            <div class="transport-controls">
                <button class="transport-btn" id="playBtn" title="Play">▶</button>
                <button class="transport-btn" id="stopBtn" title="Stop" disabled>■</button>
                <button class="transport-btn" id="recordBtn" title="Record">●</button>
            </div>
            <div class="tempo-control">
                <label>BPM</label>
                <input type="number" id="tempoInput" value="120" min="40" max="240">
            </div>
            <div class="time-display" id="timeDisplay">00:00.000</div>
        </div>

        <!-- Main Content -->
        <div class="content">
            <!-- Track List -->
            <div class="track-list">
                <div class="track-list-header">
                    <h2>Tracks</h2>
                    <button class="primary" id="addTrackBtn">+ Add Track</button>
                </div>
                <div class="tracks" id="trackList"></div>
            </div>

            <!-- Workspace -->
            <div class="workspace">
                <div class="workspace-header">
                    <h2>Instrument Controls</h2>
                </div>
                <div class="workspace-content" id="workspaceContent">
                    <div class="no-instrument">
                        Select a track and load an instrument to begin
                    </div>
                </div>
            </div>
        </div>

        <!-- Status Bar -->
        <div class="status-bar">
            <div class="status-message" id="statusMessage">Ready</div>
            <div class="cpu-meter">
                <span>CPU</span>
                <div class="cpu-bar">
                    <div class="cpu-bar-fill" id="cpuFill"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Export Modal -->
    <div class="modal-overlay" id="exportModal">
        <div class="modal">
            <h3>Export Mix</h3>
            <p>Export your mix to a WAV file. This will render the full timeline offline.</p>
            <div class="export-progress" style="display: none;" id="exportProgress">
                <p>Rendering...</p>
                <div class="progress-bar">
                    <div class="progress-bar-fill" id="exportProgressFill"></div>
                </div>
            </div>
            <div class="modal-buttons">
                <button id="cancelExportBtn">Cancel</button>
                <button class="primary" id="startExportBtn">Start Export</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // DAW Engine
        // ============================================
        class DAW {
            constructor() {
                this.tracks = [];
                this.isPlaying = false;
                this.isRecording = false;
                this.tempo = 120;
                this.selectedTrackId = null;
                this.trackIdCounter = 0;

                this.initializeAudio();
                this.initializeUI();
                this.updateTimeDisplay();
            }

            async initializeAudio() {
                // Master output
                this.masterChannel = new Tone.Channel({
                    volume: 0,
                    pan: 0
                }).toDestination();

                // Master meter
                this.masterMeter = new Tone.Meter();
                this.masterChannel.connect(this.masterMeter);

                Tone.Transport.bpm.value = this.tempo;
            }

            initializeUI() {
                // Transport controls
                document.getElementById('playBtn').addEventListener('click', () => this.play());
                document.getElementById('stopBtn').addEventListener('click', () => this.stop());
                document.getElementById('recordBtn').addEventListener('click', () => this.toggleRecord());

                // Tempo
                document.getElementById('tempoInput').addEventListener('change', (e) => {
                    this.setTempo(parseInt(e.target.value));
                });

                // Track management
                document.getElementById('addTrackBtn').addEventListener('click', () => this.addTrack());

                // Export
                document.getElementById('exportBtn').addEventListener('click', () => this.showExportModal());
                document.getElementById('startExportBtn').addEventListener('click', () => this.exportMix());
                document.getElementById('cancelExportBtn').addEventListener('click', () => this.hideExportModal());

                // Project management
                document.getElementById('saveProjectBtn').addEventListener('click', () => this.saveProject());
                document.getElementById('loadProjectBtn').addEventListener('click', () => this.loadProject());

                // Time display update loop
                setInterval(() => {
                    if (this.isPlaying) {
                        this.updateTimeDisplay();
                    }
                }, 50);
            }

            async play() {
                await Tone.start();
                Tone.Transport.start();
                this.isPlaying = true;

                // Start all tracks
                this.tracks.forEach(track => {
                    if (track.instrument) {
                        track.instrument.start();
                    }
                });

                document.getElementById('playBtn').classList.add('active');
                document.getElementById('stopBtn').disabled = false;
                this.setStatus('Playing...', true);
            }

            stop() {
                Tone.Transport.stop();
                Tone.Transport.position = 0;
                this.isPlaying = false;
                this.isRecording = false;

                // Stop all tracks
                this.tracks.forEach(track => {
                    if (track.instrument) {
                        track.instrument.stop();
                    }
                    track.armed = false;
                    this.updateTrackUI(track);
                });

                document.getElementById('playBtn').classList.remove('active');
                document.getElementById('stopBtn').disabled = true;
                document.getElementById('recordBtn').classList.remove('active');
                this.setStatus('Stopped');
            }

            toggleRecord() {
                if (!this.isPlaying) {
                    this.isRecording = true;
                    this.play();
                    document.getElementById('recordBtn').classList.add('active');
                    this.setStatus('Recording...', true);
                } else if (this.isRecording) {
                    this.isRecording = false;
                    document.getElementById('recordBtn').classList.remove('active');
                    this.setStatus('Playing...', true);
                }
            }

            setTempo(bpm) {
                this.tempo = Math.max(40, Math.min(240, bpm));
                Tone.Transport.bpm.rampTo(this.tempo, 0.1);
                document.getElementById('tempoInput').value = this.tempo;

                // Update all instruments
                this.tracks.forEach(track => {
                    if (track.instrument && track.instrument.setTempo) {
                        track.instrument.setTempo(this.tempo);
                    }
                });
            }

            updateTimeDisplay() {
                const position = Tone.Transport.seconds;
                const minutes = Math.floor(position / 60);
                const seconds = Math.floor(position % 60);
                const ms = Math.floor((position % 1) * 1000);

                const display = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}.${String(ms).padStart(3, '0')}`;
                document.getElementById('timeDisplay').textContent = display;
            }

            addTrack() {
                const trackId = this.trackIdCounter++;
                const colors = ['#6a9bd8', '#d84a9b', '#4ad8a0', '#d8b84a', '#a84ad8'];
                const color = colors[trackId % colors.length];

                const track = {
                    id: trackId,
                    name: `Track ${trackId + 1}`,
                    color: color,
                    volume: 0, // dB
                    pan: 0,
                    solo: false,
                    muted: false,
                    armed: false,
                    instrument: null,
                    instrumentType: null,
                    channel: new Tone.Channel({ volume: 0, pan: 0 }).connect(this.masterChannel),
                    meter: new Tone.Meter()
                };

                track.channel.connect(track.meter);
                this.tracks.push(track);
                this.createTrackUI(track);
                this.selectTrack(trackId);
            }

            removeTrack(trackId) {
                const index = this.tracks.findIndex(t => t.id === trackId);
                if (index === -1) return;

                const track = this.tracks[index];

                // Dispose instrument
                if (track.instrument && track.instrument.dispose) {
                    track.instrument.dispose();
                }

                // Dispose audio nodes
                track.channel.dispose();
                track.meter.dispose();

                this.tracks.splice(index, 1);
                document.getElementById(`track-${trackId}`).remove();

                if (this.selectedTrackId === trackId) {
                    this.selectedTrackId = null;
                    this.updateWorkspace();
                }
            }

            selectTrack(trackId) {
                this.selectedTrackId = trackId;

                // Update UI
                document.querySelectorAll('.track').forEach(el => {
                    el.style.background = '#2a2a3a';
                });
                const trackEl = document.getElementById(`track-${trackId}`);
                if (trackEl) {
                    trackEl.style.background = '#32324a';
                }

                this.updateWorkspace();
            }

            getTrack(trackId) {
                return this.tracks.find(t => t.id === trackId);
            }

            setTrackVolume(trackId, db) {
                const track = this.getTrack(trackId);
                if (track) {
                    track.volume = db;
                    track.channel.volume.rampTo(db, 0.05);
                }
            }

            setTrackPan(trackId, pan) {
                const track = this.getTrack(trackId);
                if (track) {
                    track.pan = pan;
                    track.channel.pan.rampTo(pan, 0.05);
                }
            }

            toggleTrackSolo(trackId) {
                const track = this.getTrack(trackId);
                if (!track) return;

                track.solo = !track.solo;
                this.updateSoloMute();
                this.updateTrackUI(track);
            }

            toggleTrackMute(trackId) {
                const track = this.getTrack(trackId);
                if (!track) return;

                track.muted = !track.muted;
                this.updateSoloMute();
                this.updateTrackUI(track);
            }

            toggleTrackArm(trackId) {
                const track = this.getTrack(trackId);
                if (!track) return;

                track.armed = !track.armed;
                this.updateTrackUI(track);
            }

            updateSoloMute() {
                const anySolo = this.tracks.some(t => t.solo);

                this.tracks.forEach(track => {
                    if (anySolo) {
                        // If any track is soloed, mute all non-solo tracks
                        track.channel.mute = !track.solo;
                    } else {
                        // Otherwise, respect individual mute settings
                        track.channel.mute = track.muted;
                    }
                });
            }

            loadInstrument(trackId, instrumentType) {
                const track = this.getTrack(trackId);
                if (!track) return;

                // Dispose old instrument
                if (track.instrument && track.instrument.dispose) {
                    track.instrument.dispose();
                }

                // For now, create a simple test oscillator
                // In the real implementation, this would load actual instrument modules
                track.instrumentType = instrumentType;
                track.instrument = this.createTestInstrument(track.channel, instrumentType);

                this.updateWorkspace();
                this.setStatus(`Loaded ${instrumentType} on ${track.name}`);
            }

            createTestInstrument(outputNode, type) {
                // This is a placeholder test instrument
                // Replace with actual instrument module loading
                const instrument = {
                    type: type,
                    synth: null,
                    pattern: null,
                    isPlaying: false,

                    start: function() {
                        if (this.isPlaying) return;
                        this.isPlaying = true;

                        if (type === 'synth') {
                            this.synth = new Tone.PolySynth(Tone.Synth).connect(outputNode);
                            const notes = ['C4', 'E4', 'G4', 'B4'];
                            this.pattern = new Tone.Pattern((time, note) => {
                                this.synth.triggerAttackRelease(note, '8n', time);
                            }, notes, 'up');
                            this.pattern.start(0);
                        } else if (type === 'bass') {
                            this.synth = new Tone.MonoSynth({
                                oscillator: { type: 'sawtooth' },
                                envelope: { attack: 0.01, decay: 0.2, sustain: 0.3, release: 0.4 }
                            }).connect(outputNode);
                            const notes = ['C2', 'C2', 'G2', 'F2'];
                            let index = 0;
                            this.pattern = new Tone.Loop((time) => {
                                this.synth.triggerAttackRelease(notes[index % notes.length], '4n', time);
                                index++;
                            }, '4n');
                            this.pattern.start(0);
                        } else if (type === 'drums') {
                            // Simple drum pattern
                            const kick = new Tone.MembraneSynth().connect(outputNode);
                            const snare = new Tone.NoiseSynth({
                                envelope: { attack: 0.001, decay: 0.2, sustain: 0 }
                            }).connect(outputNode);

                            this.pattern = new Tone.Sequence((time, step) => {
                                if (step % 4 === 0) kick.triggerAttackRelease('C1', '8n', time);
                                if (step % 4 === 2) snare.triggerAttackRelease('8n', time);
                            }, [0, 1, 2, 3, 4, 5, 6, 7], '8n');
                            this.pattern.start(0);
                        }
                    },

                    stop: function() {
                        if (!this.isPlaying) return;
                        this.isPlaying = false;

                        if (this.pattern) {
                            this.pattern.stop();
                            this.pattern.dispose();
                            this.pattern = null;
                        }
                        if (this.synth) {
                            this.synth.dispose();
                            this.synth = null;
                        }
                    },

                    dispose: function() {
                        this.stop();
                    },

                    setTempo: function(bpm) {
                        // Tempo is handled by Transport
                    }
                };

                return instrument;
            }

            createTrackUI(track) {
                const trackEl = document.createElement('div');
                trackEl.className = 'track';
                trackEl.id = `track-${track.id}`;
                trackEl.addEventListener('click', () => this.selectTrack(track.id));

                trackEl.innerHTML = `
                    <div class="track-header">
                        <div class="track-name">${track.name}</div>
                        <div class="track-color" style="background: ${track.color}"></div>
                    </div>

                    <div class="track-controls">
                        <div class="track-control-row">
                            <div class="track-control-label">Volume</div>
                            <input type="range" class="track-fader"
                                   min="-40" max="6" value="${track.volume}" step="0.1"
                                   data-track="${track.id}" data-param="volume">
                            <span style="font-size: 0.7em; color: #6a6a7a;">${track.volume.toFixed(1)} dB</span>
                        </div>
                        <div class="track-control-row">
                            <div class="track-control-label">Pan</div>
                            <input type="range" class="track-fader"
                                   min="-1" max="1" value="${track.pan}" step="0.01"
                                   data-track="${track.id}" data-param="pan">
                            <span style="font-size: 0.7em; color: #6a6a7a;">${track.pan > 0 ? 'R' : track.pan < 0 ? 'L' : 'C'}</span>
                        </div>
                    </div>

                    <div class="track-buttons">
                        <button class="track-btn arm" data-track="${track.id}" data-action="arm">Arm</button>
                        <button class="track-btn solo" data-track="${track.id}" data-action="solo">Solo</button>
                        <button class="track-btn mute" data-track="${track.id}" data-action="mute">Mute</button>
                        <button class="track-btn danger" data-track="${track.id}" data-action="delete">Del</button>
                    </div>

                    <div class="track-instrument">
                        <select data-track="${track.id}">
                            <option value="">Select Instrument...</option>
                            <option value="synth">Test Synth</option>
                            <option value="bass">Test Bass</option>
                            <option value="drums">Test Drums</option>
                        </select>
                    </div>

                    <div class="track-meter">
                        <div class="track-meter-fill" data-meter="${track.id}"></div>
                    </div>
                `;

                document.getElementById('trackList').appendChild(trackEl);

                // Bind events
                trackEl.querySelector('[data-param="volume"]').addEventListener('input', (e) => {
                    const val = parseFloat(e.target.value);
                    this.setTrackVolume(track.id, val);
                    e.target.nextElementSibling.textContent = val.toFixed(1) + ' dB';
                });

                trackEl.querySelector('[data-param="pan"]').addEventListener('input', (e) => {
                    const val = parseFloat(e.target.value);
                    this.setTrackPan(track.id, val);
                    const label = val > 0.05 ? 'R' : val < -0.05 ? 'L' : 'C';
                    e.target.nextElementSibling.textContent = label;
                });

                trackEl.querySelectorAll('.track-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const action = btn.dataset.action;
                        const trackId = parseInt(btn.dataset.track);

                        switch(action) {
                            case 'arm': this.toggleTrackArm(trackId); break;
                            case 'solo': this.toggleTrackSolo(trackId); break;
                            case 'mute': this.toggleTrackMute(trackId); break;
                            case 'delete':
                                if (confirm(`Delete ${track.name}?`)) {
                                    this.removeTrack(trackId);
                                }
                                break;
                        }
                    });
                });

                trackEl.querySelector('select').addEventListener('change', (e) => {
                    const instrumentType = e.target.value;
                    if (instrumentType) {
                        this.loadInstrument(track.id, instrumentType);
                    }
                });

                // Start meter animation
                this.startMeterAnimation(track);
            }

            updateTrackUI(track) {
                const trackEl = document.getElementById(`track-${track.id}`);
                if (!trackEl) return;

                trackEl.classList.toggle('armed', track.armed);
                trackEl.classList.toggle('solo', track.solo);
                trackEl.classList.toggle('muted', track.muted);

                trackEl.querySelector('[data-action="arm"]').classList.toggle('active', track.armed);
                trackEl.querySelector('[data-action="solo"]').classList.toggle('active', track.solo);
                trackEl.querySelector('[data-action="mute"]').classList.toggle('active', track.muted);
            }

            startMeterAnimation(track) {
                setInterval(() => {
                    const level = track.meter.getValue();
                    const normalized = Math.max(0, Math.min(100, (level + 60) * 1.67)); // -60 to 0 dB mapped to 0-100%
                    const meterEl = document.querySelector(`[data-meter="${track.id}"]`);
                    if (meterEl) {
                        meterEl.style.width = normalized + '%';
                    }
                }, 50);
            }

            updateWorkspace() {
                const workspace = document.getElementById('workspaceContent');

                if (this.selectedTrackId === null) {
                    workspace.innerHTML = '<div class="no-instrument">Select a track to view controls</div>';
                    return;
                }

                const track = this.getTrack(this.selectedTrackId);
                if (!track) return;

                if (!track.instrument) {
                    workspace.innerHTML = '<div class="no-instrument">Load an instrument to view controls</div>';
                    return;
                }

                // Show instrument info
                workspace.innerHTML = `
                    <div class="instrument-panel">
                        <h3>${track.name} - ${track.instrumentType}</h3>
                        <p style="margin-top: 10px; color: #9a9aaa;">
                            Instrument controls will appear here once you integrate your actual instrument modules.
                            See INTEGRATION_GUIDE.md for details.
                        </p>
                    </div>
                `;

                // If instrument has getUI method, append it
                if (track.instrument.getUI && typeof track.instrument.getUI === 'function') {
                    const ui = track.instrument.getUI();
                    if (ui) {
                        workspace.querySelector('.instrument-panel').appendChild(ui);
                    }
                }
            }

            showExportModal() {
                document.getElementById('exportModal').classList.add('show');
            }

            hideExportModal() {
                document.getElementById('exportModal').classList.remove('show');
                document.getElementById('exportProgress').style.display = 'none';
                document.getElementById('exportProgressFill').style.width = '0%';
            }

            async exportMix() {
                document.getElementById('startExportBtn').disabled = true;
                document.getElementById('exportProgress').style.display = 'block';

                this.setStatus('Exporting...', true);

                // Calculate export duration (default to 8 bars at current tempo)
                const barsToExport = 8;
                const beatsPerBar = 4;
                const secondsPerBeat = 60 / this.tempo;
                const duration = barsToExport * beatsPerBar * secondsPerBeat;

                try {
                    // Use Tone.Offline to render audio faster than real-time
                    const buffer = await Tone.Offline(async () => {
                        // Recreate audio graph for offline rendering
                        const offlineMaster = new Tone.Channel().toDestination();

                        // Start all non-muted instruments
                        const anySolo = this.tracks.some(t => t.solo);

                        this.tracks.forEach(track => {
                            if (!track.instrument) return;

                            // Apply solo/mute logic
                            if (anySolo && !track.solo) return;
                            if (track.muted) return;

                            // Create temporary channel for this track
                            const tempChannel = new Tone.Channel({
                                volume: track.volume,
                                pan: track.pan
                            }).connect(offlineMaster);

                            // Create and start instrument (simplified for test instruments)
                            const inst = this.createTestInstrument(tempChannel, track.instrumentType);
                            inst.start();
                        });

                        // Let it play
                        Tone.Transport.start();

                    }, duration);

                    // Convert to WAV and download
                    const wavBlob = this.bufferToWav(buffer);
                    const url = URL.createObjectURL(wavBlob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `export-${Date.now()}.wav`;
                    a.click();

                    this.setStatus('Export complete!', true);
                    setTimeout(() => this.setStatus('Ready'), 3000);

                } catch (error) {
                    console.error('Export error:', error);
                    this.setStatus('Export failed!');
                }

                document.getElementById('startExportBtn').disabled = false;
                this.hideExportModal();
            }

            bufferToWav(buffer) {
                const numberOfChannels = buffer.numberOfChannels;
                const sampleRate = buffer.sampleRate;
                const format = 1; // PCM
                const bitDepth = 16;

                const bytesPerSample = bitDepth / 8;
                const blockAlign = numberOfChannels * bytesPerSample;

                const data = [];
                for (let i = 0; i < numberOfChannels; i++) {
                    data.push(buffer.getChannelData(i));
                }

                const dataLength = data[0].length * numberOfChannels * bytesPerSample;
                const buffer32 = new ArrayBuffer(44 + dataLength);
                const view = new DataView(buffer32);

                // WAV header
                const writeString = (offset, string) => {
                    for (let i = 0; i < string.length; i++) {
                        view.setUint8(offset + i, string.charCodeAt(i));
                    }
                };

                writeString(0, 'RIFF');
                view.setUint32(4, 36 + dataLength, true);
                writeString(8, 'WAVE');
                writeString(12, 'fmt ');
                view.setUint32(16, 16, true);
                view.setUint16(20, format, true);
                view.setUint16(22, numberOfChannels, true);
                view.setUint32(24, sampleRate, true);
                view.setUint32(28, sampleRate * blockAlign, true);
                view.setUint16(32, blockAlign, true);
                view.setUint16(34, bitDepth, true);
                writeString(36, 'data');
                view.setUint32(40, dataLength, true);

                // Write audio data
                let offset = 44;
                for (let i = 0; i < data[0].length; i++) {
                    for (let channel = 0; channel < numberOfChannels; channel++) {
                        const sample = Math.max(-1, Math.min(1, data[channel][i]));
                        view.setInt16(offset, sample < 0 ? sample * 0x8000 : sample * 0x7FFF, true);
                        offset += 2;
                    }
                }

                return new Blob([buffer32], { type: 'audio/wav' });
            }

            saveProject() {
                const project = {
                    tempo: this.tempo,
                    tracks: this.tracks.map(track => ({
                        id: track.id,
                        name: track.name,
                        color: track.color,
                        volume: track.volume,
                        pan: track.pan,
                        solo: track.solo,
                        muted: track.muted,
                        instrumentType: track.instrumentType,
                        instrumentState: track.instrument && track.instrument.getState ?
                            track.instrument.getState() : null
                    }))
                };

                const json = JSON.stringify(project, null, 2);
                const blob = new Blob([json], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `project-${Date.now()}.json`;
                a.click();

                this.setStatus('Project saved!', true);
                setTimeout(() => this.setStatus('Ready'), 2000);
            }

            loadProject() {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.json';
                input.onchange = async (e) => {
                    const file = e.target.files[0];
                    if (!file) return;

                    const text = await file.text();
                    const project = JSON.parse(text);

                    // Clear current project
                    while (this.tracks.length > 0) {
                        this.removeTrack(this.tracks[0].id);
                    }

                    // Set tempo
                    this.setTempo(project.tempo);

                    // Recreate tracks
                    project.tracks.forEach(trackData => {
                        this.addTrack();
                        const track = this.tracks[this.tracks.length - 1];

                        track.name = trackData.name;
                        track.color = trackData.color;
                        this.setTrackVolume(track.id, trackData.volume);
                        this.setTrackPan(track.id, trackData.pan);

                        if (trackData.solo) this.toggleTrackSolo(track.id);
                        if (trackData.muted) this.toggleTrackMute(track.id);

                        if (trackData.instrumentType) {
                            this.loadInstrument(track.id, trackData.instrumentType);

                            if (trackData.instrumentState && track.instrument.setState) {
                                track.instrument.setState(trackData.instrumentState);
                            }
                        }
                    });

                    this.setStatus('Project loaded!', true);
                    setTimeout(() => this.setStatus('Ready'), 2000);
                };
                input.click();
            }

            setStatus(message, active = false) {
                const statusEl = document.getElementById('statusMessage');
                statusEl.textContent = message;
                statusEl.classList.toggle('active', active);
            }
        }

        // Initialize DAW
        const daw = new DAW();

        // Add some default tracks
        daw.addTrack();
    </script>
